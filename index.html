<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Play 4 Amazing Games</title>
    <meta name="description"
        content="A premium arcade experience with 4 unique games: Tic-Tac-Toe, Rock Paper Scissors, Word Guessing, and Battle Quest.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <div class="idioma-selector">
        <button onclick="changeLanguage('es')" class="btn-lang" id="btn-es">Español</button>
        <button onclick="changeLanguage('en')" class="btn-lang" id="btn-en">English</button>
    </div>

    <style>
        .idioma-selector {
            top: 10px;
            right: 10px;
            position: fixed;    
            display: flex;
            gap: 10px;
            margin: 20px;
            z-index: 999;
        }

        .btn-lang {
            padding: 8px 16px;
            border: 2px solid #007bff;
            background-color: white;
            color: #007bff;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-lang:hover {
            background-color: #f0f7ff;
        }

        /* Active highlight styling state */
        .btn-active {
            background-color: #007bff;
            color: white;
        }

        /* ===== GUESSWORD KEYBOARD & BOXES ===== */
        .gw-word-display {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 18px auto 10px;
        }

        .gw-letter-box {
            width: 38px;
            height: 44px;
            border: 2px solid rgba(255,255,255,0.35);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 1rem;
            color: #fff;
            background: rgba(0,0,0,0.4);
            transition: background 0.3s, border-color 0.3s;
        }

        .gw-letter-box.correct {
            background: #22c55e;
            border-color: #16a34a;
            color: #fff;
            box-shadow: 0 0 10px #22c55e88;
        }

        .gw-keyboard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: 14px auto;
        }

        .gw-keyboard-row {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .gw-key {
            min-width: 32px;
            height: 36px;
            padding: 0 8px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.55rem;
            transition: background 0.2s, opacity 0.2s;
        }

        .gw-key.hit {
            background: #22c55e;
            border-color: #16a34a;
            color: #fff;
            opacity: 0.8;
        }

        .gw-key.miss {
            background: rgba(255,0,0,0.25);
            border-color: rgba(255,0,0,0.4);
            opacity: 0.5;
        }

        .gw-key.wrong-position {
            background: #eab308;
            border-color: #ca8a04;
            color: #000;
            opacity: 0.8;
        }

        .gw-length-label {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.6rem;
            color: rgba(255,255,255,0.6);
            text-align: center;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Extra Retro Fonts elements */
        #arc-simulation-chamber h2,
        .hero h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
        }

        .hero h1 {
            font-size: 4rem;
            letter-spacing: -5px;
        }

        .back-msg {
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            color: black;
        }

        .game-card h3 {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <div class="grid-container"></div>
    <div class="floating-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div id="arc-system-core">
        <main id="arc-hub-portal" class="view active">
            <header class="hero">
                <h1><span>ARCADE</span> HUB</h1>
                <p>Est. 1984 // 2026 Edition</p>
            </header>

            <div class="game-grid">
                <div class="game-card" data-game="guessword">
                    <span class="card-icon">🧐</span>
                    <h3>Guess Word</h3>
                    <button class="btn-play">INSERT COIN</button>
                    <div style="position: absolute; bottom: 5px; right: 8px; font-size: 10px; opacity: 0.4">LVL 1</div>
                </div>

                <div class="game-card" data-game="battlegame">
                    <span class="card-icon">⚔️</span>
                    <h3>Battle Quest</h3>
                    <button class="btn-play">START FIGHT</button>
                </div>

                <div class="game-card" data-game="rps">
                    <span class="card-icon">✂️</span>
                    <h3>Roshambo</h3>
                    <button class="btn-play">CHALLENGE</button>
                </div>

                <div class="game-card" data-game="tictactoe">
                    <span class="card-icon">⭕</span>
                    <h3>Neon Duel</h3>
                    <button class="btn-play">2P ONLY</button>
                </div>
            </div>
        </main>

        <section id="arc-simulation-chamber" class="view">
            <div class="game-container">
                <button id="arc-abort-signal" class="btn-back">
                    <span class="back-msg">EXIT HUB</span>
                </button>
                <div id="arc-render-zone">
                    </div>
            </div>
        </section>

        <div id="arc-dialog-veil" class="modal-overlay">
            <div class="modal">
                <button id="arc-dialog-close" class="modal-close">&times;</button>
                <div class="modal-header">
                    <span id="arc-dialog-glyph">🎮</span>
                    <h2 id="arc-dialog-header">MISSION BRIEFING</h2>
                </div>
                <p id="arc-dialog-content">Instructions go here...</p>
                <button id="arc-mission-trigger" class="btn-play">START MISSION</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
